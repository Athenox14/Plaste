name: Fuzzing

# Nocturne et non a chaque poussee : une campagne utile dure des minutes, pas des
# secondes, et bloquerait les pull requests pour rien. Les invariants rapides
# sont deja couverts par les tests de proprietes (proptest) dans `cargo test`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duree_secondes:
        description: "Duree par cible, en secondes"
        required: false
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cible: [tus_metadata]

    steps:
      - uses: actions/checkout@v5

      # libfuzzer-sys exige nightly : les sanitizers et `-C passes=sancov` ne
      # sont pas disponibles en stable.
      - name: Chaine nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Cache cargo et cargo-fuzz
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Installer cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      # Le corpus est ce qui fait la valeur d'une campagne : sans lui, chaque
      # nuit repart de l'entree vide et ne depasse jamais la surface triviale.
      # On le conserve d'une nuit sur l'autre par le cache, en clef glissante
      # pour qu'une nouvelle execution reprenne toujours la derniere.
      - name: Restaurer le corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.cible }}
          key: corpus-${{ matrix.cible }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.cible }}-

      - name: Campagne
        working-directory: fuzz
        run: |
          duree="${{ github.event.inputs.duree_secondes || '600' }}"
          mkdir -p "corpus/${{ matrix.cible }}"
          # -runs=-1 : illimite en nombre, c'est -max_total_time qui borne.
          # -timeout=10 : une entree qui depasse 10 s est un defaut en soi.
          cargo fuzz run "${{ matrix.cible }}" -- \
            -max_total_time="$duree" \
            -runs=-1 \
            -timeout=10 \
            -print_final_stats=1

      # Reduit le corpus : sans ca il gonfle indefiniment et chaque nuit passe
      # de plus en plus de temps a le rejouer au lieu d'explorer.
      - name: Minimiser le corpus
        if: success()
        working-directory: fuzz
        run: cargo fuzz cmin "${{ matrix.cible }}" || true

      - name: Conserver le corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.cible }}
          key: corpus-${{ matrix.cible }}-${{ github.run_id }}

      # Un plantage n'est exploitable que si l'entree qui le declenche sort du
      # runner : sans cette etape, l'echec est visible mais irreproductible.
      - name: Publier les entrees fautives
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plantages-${{ matrix.cible }}
          path: |
            fuzz/artifacts/${{ matrix.cible }}
          if-no-files-found: ignore
          retention-days: 30
