name: Docker Image

on:
  # Construire a chaque poussee sur main, et pas seulement a la main. Sans ce
  # declencheur, l'image de prod est restee 10 commits en arriere pendant des
  # jours : le correctif d'envoi resumable etait ecrit, teste et fusionne, mais
  # jamais publie, et la prod continuait de rejeter chaque tranche de 4 Mio
  # (l'ancienne image n'ayant pas de limite explicite sur le routeur tus, axum
  # appliquait sa valeur par defaut de 2 Mio). Un correctif non deploye ne
  # corrige rien.
  push:
    branches: [main]
    # La documentation seule ne change pas l'image.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: athenox14/plaste

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # GHA-backed layer cache: the Dockerfile's BuildKit cache mounts (cargo
          # registry + target dir) only help across builds if the underlying layer
          # cache itself persists between CI runs — this is what makes that happen.
          cache-from: type=gha
          cache-to: type=gha,mode=max
